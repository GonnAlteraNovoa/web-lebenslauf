<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web CV</title>
  </head>
  <body>
    <div id="app" x-data="app()" x-cloak class="min-h-screen">
      <header class="sticky top-0 z-50 border-b border-theme bg-(--bg)/95 backdrop-blur">
        <div class="relative">
          <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
            <div class="flex items-baseline gap-2">
              <span class="text-sm font-semibold tracking-[0.18em] uppercase">Web CV Project</span>
              <span class="text-sm text-muted">Lebenslauf by</span>
            </div>

            <div class="flex items-center gap-0.5 text-sm">
              <button
                class="rounded-full px-3 py-1.5 transition"
                :class="current_lang === 'en' ? 'text-accent surface' : 'text-muted'"
                @click="set_lang('en')"
              >
                EN
              </button>
              <button
                class="rounded-full px-3 py-1.5 transition"
                :class="current_lang === 'de' ? 'text-accent surface' : 'text-muted'"
                @click="set_lang('de')"
              >
                DE
              </button>
              <button
                class="rounded-full px-3 py-1.5 transition"
                :class="current_lang === 'es' ? 'text-accent surface' : 'text-muted'"
                @click="set_lang('es')"
              >
                ES
              </button>
              <button
                class="ml-2 rounded-full px-3 py-1.5 transition"
                :class="is_dark_mode ? 'text-accent surface' : 'text-muted'"
                @click="toggle_dark_mode()"
              >
                Dark
              </button>
              <div class="px-10 invisible"></div>
            </div>
          </div>

          <button class="hover:surface absolute right-4 top-1/2 -translate-y-1/2 rounded-full px-4 py-1.5 text-sm">
            Login
          </button>
        </div>
      </header>

      <main class="mx-auto max-w-5xl px-4 py-4 md:py-5">
        <h4
          class="pt-6 text-sm font-semibold uppercase tracking-[0.2em] text-accent"
          x-text="content.personal_information.fields.job_title"
        ></h4>
        <section class="intro-section space-y-10">
          <div class="grid gap-10 lg:grid-cols-[1.4fr_0.6fr]">
            <div class="space-y-8 pt-2 md:pt-4">
              <div class="grid gap-6 md:grid-cols-[1fr_auto] md:items-start">
                <div class="space-y-4">
                  <h1 class="max-w-3xl leading-none tracking-tight">
                    <span
                      class="block text-6xl font-semibold md:text-7xl"
                      x-text="content.personal_information.fields.first_name"
                    ></span>
                    <span
                      class="block text-4xl font-semibold md:text-6xl"
                      x-text="content.personal_information.fields.last_name"
                    ></span>
                  </h1>
                </div>
              </div>
              <div
                class="max-w-2xl space-y-3 border-l-2 border-theme pl-5"
                x-show="content.professional_summary.text.length"
              >
                <h2 class="text-base font-semibold uppercase tracking-[0.14em]" x-text="content.professional_summary.title"></h2>
                <div class="space-y-3 text-base text-muted leading-relaxed">
                  <template x-for="paragraph in content.professional_summary.text" :key="paragraph">
                    <p x-text="paragraph"></p>
                  </template>
                </div>
              </div>

              <div x-show="content.core_skills.groups.length">
                <h2 class="pt-4 text-xl font-semibold" x-text="content.core_skills.title"></h2>
                <div class="space-y-4 pt-4">
                  <template x-for="group in content.core_skills.groups" :key="group.title">
                    <div class="grid gap-3 border-b border-theme pb-4 last:border-b-0">
                      <p class="text-sm uppercase tracking-[0.12em] text-muted" x-text="group.title"></p>
                      <ul class="space-y-1">
                        <template x-for="item in group.items" :key="item">
                          <li class="flex gap-2 text-sm leading-relaxed">
                            <span class="w-3 text-muted">-</span>
                            <span class="text-muted" x-text="item"></span>
                          </li>
                        </template>
                      </ul>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <aside class="sticky top-24 space-y-6 self-start">
              <div class="hero-actions flex justify-end gap-1 -mt-2 md:-mt-4">
                <a
                  href="mailto:gonzaloalteranovoa@gmail.com"
                  class="hover:surface border-transparent border rounded-full px-4 py-2 text-sm text-muted"
                >
                  Contact
                </a>
                <button
                  class="hover:surface border-transparent border rounded-full px-4 py-2 text-sm text-muted"
                  @click="window.print()"
                  >
                    Print / PDF
                </button>
              </div>
              <div class="sidebar-card personal-card surface rounded-2xl p-3">
                <p class="text-base font-semibold uppercase tracking-[0.14em]" x-text="content.personal_information.title"></p>
                <ul class="mt-1 pl-4 space-y-1.5">
                  <template x-for="item in personal_info_items" :key="item.key">
                    <li>
                      <p class="text-sm tracking-[0.12em] text-muted" x-text="item.label"></p>
                      <p class="text-base font-medium" x-text="item.value"></p>
                    </li>
                  </template>
                </ul>
              </div>
              <div class="sidebar-card languages-card surface rounded-2xl p-3" x-show="content.languages.items.length">
                <p class="text-base font-semibold uppercase tracking-[0.14em]" x-text="content.languages.title"></p>
                <ul class="mt-2 pl-4 space-y-2">
                  <template x-for="item in content.languages.items" :key="item.name">
                    <li>
                      <div class="flex items-center gap-2">
                        <span class="text-base" x-text="item.flag"></span>
                        <span x-text="item.name"></span>
                      </div>

                      <p class="pl-7 text-sm text-muted leading-relaxed" x-text="item.level"></p>

                      <a
                        x-show="item.certificate"
                        class="certificate-link block pl-7 text-xs uppercase tracking-[0.12em] text-accent"
                        :href="item.certificate?.url || '#'"
                        x-text="item.certificate?.label"
                      ></a>
                    </li>
                  </template>
                </ul>
              </div>
            </aside>
          </div>
        </section>
        <section class="space-y-4 mt-10">
          <div x-show="experience_items.length">
            <h2 class="text-xl font-semibold" x-text="content.professional_experience.title"></h2>
            <div class="space-y-1">
              <template x-for="item in experience_items" :key="item.company + item.role">
                <div class="experience-item grid gap-2 border-b border-theme py-4 md:grid-cols-[11rem_1fr]">
                  <div class="text-xs uppercase tracking-[0.12em] text-muted leading-relaxed md:pt-1">
                    <span x-text="item.start_date"></span>
                    <span>-</span>
                    <span x-text="item.end_date"></span>
                  </div>

                  <div class="space-y-3">
                    <div class="space-y-1">
                      <p class="text-lg font-medium leading-snug" x-text="item.company"></p>
                      <p class="text-sm leading-relaxed" x-text="item.role"></p>
                      <p class="text-xs uppercase tracking-widest text-muted" x-text="item.location"></p>
                    </div>

                    <ul class="space-y-2">
                      <template x-for="point in item.highlights" :key="point">
                        <li class="flex gap-3 text-sm text-muted leading-relaxed">
                          <span class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-(--accent)"></span>
                          <span x-text="point"></span>
                        </li>
                      </template>
                    </ul>
                  </div>
                </div>
              </template>
            </div>
          </div>
          <div x-show="content.education.items.length">
            <h2 class="text-xl font-semibold" x-text="content.education.title"></h2>
            <div class="space-y-1">
              <template x-for="item in content.education.items" :key="item.institution + item.degree">
                <div class="education-item grid gap-2 border-b border-theme py-4 md:grid-cols-[11rem_1fr]">
                  <div class="text-xs uppercase tracking-[0.12em] text-muted leading-relaxed md:pt-1">
                    <span x-text="item.start_date"></span>
                    <span>-</span>
                    <span x-text="item.end_date"></span>
                  </div>

                  <div class="space-y-2">
                    <div class="space-y-1">
                      <p class="text-lg font-medium leading-snug" x-text="item.institution"></p>
                      <p class="text-sm leading-relaxed" x-text="item.degree"></p>
                      <p class="text-xs uppercase tracking-widest text-muted" x-text="item.location"></p>
                    </div>

                    <ul class="space-y-1" x-show="item.highlights.length">
                      <template x-for="point in item.highlights" :key="point">
                        <li class="flex gap-1 text-sm text-muted leading-relaxed">
                          <span class="w-3 text-muted">-</span>
                          <span x-text="point"></span>
                        </li>
                      </template>
                    </ul>
                  </div>
                </div>
              </template>
            </div>
          </div>
          <div class="projects-section grid gap-8 pt-4">
            <div x-show="content.selected_projects.items.length">
              <h2 class="text-xl font-semibold" x-text="content.selected_projects.title"></h2>
              <div class="mt-4 grid gap-4 md:grid-cols-2">
                <template x-for="item in content.selected_projects.items" :key="item.name">
                  <a
                    class="surface group block rounded-2xl p-4 transition hover:-translate-y-0.5 hover:border-indigo-400/60 hover:shadow-lg hover:shadow-indigo-500/10"
                    :href="item.url || '#'"
                    :aria-disabled="!item.url"
                    :tabindex="item.url ? 0 : -1"
                  >
                    <p class="text-base font-medium leading-snug group-hover:text-indigo-300" x-text="item.name"></p>
                    <p class="mt-2 text-sm text-muted leading-relaxed" x-text="item.description"></p>
                    <p x-show="item.url" class="mt-3 text-xs font-semibold uppercase text-indigo-300">Open project</p>
                  </a>
                </template>
              </div>
            </div>
          </div>
        </section>
      </main>
      <footer class="mx-auto max-w-5xl px-4 py-10">
        <div class="border-t border-theme pt-6 text-xs uppercase tracking-[0.12em] text-muted">
          Built with Alpine.js + Tailwind + NestJS
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
